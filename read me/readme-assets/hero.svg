<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D20"/><stop offset=".48" stop-color="#21164A"/><stop offset="1" stop-color="#071F30"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#00D9FF" stop-opacity=".65"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="purple"><stop stop-color="#9B6BFF" stop-opacity=".65"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <linearGradient id="line"><stop stop-color="#00D9FF" stop-opacity="0"/><stop offset=".5" stop-color="#B79AFF"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<circle cx="190" cy="130" r="220" fill="url(#purple)" filter="url(#blur)"><animate attributeName="cx" values="190;270;190" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1030" cy="400" r="250" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cy" values="400;320;400" dur="8s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="#9D8BFF" opacity=".22"><circle cx="980" cy="130" r="90"/><circle cx="980" cy="130" r="130"/><circle cx="980" cy="130" r="170"/></g>
<g fill="#D9F8FF"><circle cx="150" cy="350" r="2"/><circle cx="300" cy="90" r="2"/><circle cx="870" cy="80" r="2"/><circle cx="1080" cy="260" r="2"/><circle cx="740" cy="450" r="2"/></g>
<path d="M70 440 Q300 360 520 440 T1130 420" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"><animate attributeName="d" values="M70 440 Q300 360 520 440 T1130 420;M70 420 Q300 500 520 410 T1130 440;M70 440 Q300 360 520 440 T1130 420" dur="8s" repeatCount="indefinite"/></path>
<text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" letter-spacing="12" fill="#9DA9D5">THE CINEMATIC UNIVERSE</text>
<text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="10" fill="#FFFFFF">MUVNA</text>
<text x="600" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" letter-spacing="4" fill="#00D9FF">BEYOND THE SCREEN. INTO THE STORY.</text>
<rect x="430" y="415" width="340" height="2" rx="1" fill="url(#line)"/>
<text x="600" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" fill="#C7CBE6">DISCOVER  ·  EXPLORE  ·  EXPERIENCE</text>
</svg>